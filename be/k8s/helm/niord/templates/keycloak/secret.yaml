{{- if and .Values.keycloak.enabled (not .Values.keycloak.existingSecret) -}}
# The local default: the bootstrap admin from keycloak.adminUser / keycloak.adminPassword. A
# cluster environment names its own Secret in keycloak.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "niord.keycloak.secretName" . }}
  labels:
    {{- include "niord.componentLabels" (list . "keycloak") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.adminUser | quote }}
  password: {{ .Values.keycloak.adminPassword | quote }}
{{- end }}
{{- /* `default dict`: values from before keycloak.db render nothing here, so that validate.yaml's message is the one the render fails with. */ -}}
{{- $db := .Values.keycloak.db | default dict }}
{{- if and .Values.keycloak.enabled (eq .Values.keycloak.mode "production") (include "niord.postgres.ownUser" .) (not $db.existingSecret) }}
---
# The local default: the user Keycloak connects to its database as (production mode), from
# keycloak.db.username / keycloak.db.password. A cluster environment names its own Secret in
# keycloak.db.existingSecret instead, and this is not rendered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "niord.keycloak.dbSecretName" . }}
  labels:
    {{- include "niord.componentLabels" (list . "keycloak") | nindent 4 }}
type: Opaque
stringData:
  username: {{ $db.username | quote }}
  password: {{ $db.password | quote }}
{{- end }}
