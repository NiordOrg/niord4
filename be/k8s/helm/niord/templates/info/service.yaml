{{- if (.Values.info | default dict).enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "niord.componentName" (list . "info") }}
  labels:
    {{- include "niord.componentLabels" (list . "info") | nindent 4 }}
spec:
  # ClusterIP by default: in a cluster the site is reached through its Ingress, and locally
  # through a port-forward (or set info.service.type=LoadBalancer to publish it on OrbStack).
  type: {{ .Values.info.service.type }}
  selector:
    {{- include "niord.componentSelectorLabels" (list . "info") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.info.service.port }}
      targetPort: http
{{- end }}
