{{- if .Values.app.enabled -}}
{{- if and .Values.secom.enabled .Values.secom.renewal.enabled }}
# The unattended certificate renewal (identity plan T3b) persists renewed keystores by
# PATCHing the SECOM secrets through the Kubernetes API — the mounted secret files are
# read-only. The app pod therefore runs under its own ServiceAccount, bound to a Role
# scoped to get/patch on EXACTLY the two SECOM secrets (least privilege: no list, no
# other secrets, nothing cluster-wide). Rendered only while secom.renewal.enabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "niord.componentName" (list . "app") }}
  labels:
    {{- include "niord.componentLabels" (list . "app") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "niord.componentName" (list . "secom-renewal") }}
  labels:
    {{- include "niord.componentLabels" (list . "app") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - {{ .Values.secom.storesSecret }}
      - {{ .Values.secom.renewal.robotSecret }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "niord.componentName" (list . "secom-renewal") }}
  labels:
    {{- include "niord.componentLabels" (list . "app") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "niord.componentName" (list . "secom-renewal") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "niord.componentName" (list . "app") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
