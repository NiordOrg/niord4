{{- if .Values.proxy.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "niord.componentName" (list . "proxy") }}
  labels:
    {{- include "niord.componentLabels" (list . "proxy") | nindent 4 }}
spec:
  # The single public entry point. On OrbStack this LoadBalancer port is published on
  # the host's localhost (http://localhost:<port>) and at <name>.k8s.orb.local.
  type: {{ .Values.proxy.service.type }}
  selector:
    {{- include "niord.componentSelectorLabels" (list . "proxy") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: http
{{- end }}
