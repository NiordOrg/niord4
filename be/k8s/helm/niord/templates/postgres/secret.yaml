{{- if and (not .Values.postgres.existingSecret) (or .Values.postgres.enabled .Values.app.enabled) -}}
# The local default: the app's database user from postgres.username / postgres.password, in a
# Secret so that no pod and no ConfigMap carries them in plain text. A cluster environment names
# its own Secret in postgres.existingSecret instead, and this is not rendered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "niord.postgres.secretName" . }}
  labels:
    {{- include "niord.componentLabels" (list . "db") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
{{- end }}
{{- /* `default dict`: values from before postgres.admin render nothing here, so that validate.yaml's message is the one the render fails with. */ -}}
{{- $admin := .Values.postgres.admin | default dict }}
{{- if and (include "niord.postgres.separateAdmin" .) (not $admin.existingSecret) }}
---
# The local default: the superuser of this release's Postgres, from postgres.admin.username /
# postgres.admin.password. A cluster environment names its own Secret in
# postgres.admin.existingSecret instead, and this is not rendered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "niord.postgres.adminSecretName" . }}
  labels:
    {{- include "niord.componentLabels" (list . "db") | nindent 4 }}
type: Opaque
stringData:
  username: {{ $admin.username | quote }}
  password: {{ $admin.password | quote }}
{{- end }}
