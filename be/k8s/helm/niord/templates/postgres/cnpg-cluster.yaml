{{- /* `default dict`: values from before postgres.cnpg render nothing here, as an empty list does. */ -}}
{{- $cnpg := .Values.postgres.cnpg | default dict }}
{{- range $db := include "niord.cnpg.databases" . | fromJsonArray }}
---
# CloudNativePG mode (values.yaml, postgres.cnpg): one database of the operator's for each entry
# of postgres.cnpg.databases, with its number in its name. The operator makes the pod, the volume
# and the Service the app connects to, {{ $db.name }}-rw, and at the first start the database and
# its owner, with the password of the owner's Secret. Nothing here is a superuser's.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $db.name }}
  labels:
    {{- include "niord.componentLabels" (list $ (printf "db-%d" (int $db.number))) | nindent 4 }}
spec:
  # One instance, and no disruption budget: with one instance a budget would block the drain of
  # the node the database is on. The pod comes back on another node with its volume.
  instances: 1
  enablePDB: false
  imageName: {{ $db.image | quote }}
  {{- with $.Values.global.imagePullSecrets }}
  # Named here: a database pod pulls its images (PostgreSQL, the operator's as an init container,
  # a plugin's sidecar) with these and nothing else. A Secret that is only in the namespace is not used.
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The database, its owner and the locale are read once, when the database is created: a change
  # afterwards reaches no database that exists. The Secret stays where the operator reads the
  # owner's password from.
  bootstrap:
    {{- if $db.restore }}
    # Made from the backups of {{ $db.restore.from }}, next to it if it still exists: its folder
    # in the store is only read. The database and the owner are named so that the owner's
    # password is the Secret's afterwards. The locale comes with the backup.
    recovery:
      source: origin
      database: {{ $.Values.postgres.database | quote }}
      owner: {{ $.Values.postgres.username | quote }}
      secret:
        name: {{ include "niord.postgres.secretName" $ }}
      {{- with $db.restore.targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ $.Values.postgres.database | quote }}
      owner: {{ $.Values.postgres.username | quote }}
      secret:
        name: {{ include "niord.postgres.secretName" $ }}
      {{- with $cnpg.locale }}
      localeCollate: {{ . | quote }}
      localeCType: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- if $db.restore }}
  externalClusters:
    - name: origin
      plugin:
        name: {{ include "niord.cnpg.backup.plugin" $ }}
        # The API server's defaults, written out (see `plugins` below).
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: {{ include "niord.cnpg.backup.store" $ }}
          serverName: {{ $db.restore.from }}
  {{- end }}
  {{- if include "niord.cnpg.backup" $ }}
  # Backups (values.yaml, postgres.cnpg.backup): the plugin sends this database's WAL files to
  # the release's ObjectStore, into a folder named after the Cluster, since no serverName is set.
  # `enabled` is the API server's default, written out: a list item it had to complete would
  # differ from this render for ever in a tool that compares the two (Argo CD).
  plugins:
    - name: {{ include "niord.cnpg.backup.plugin" $ }}
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "niord.cnpg.backup.store" $ }}
  {{- end }}
  # The app connects to the read-write Service. With one instance nothing uses the other two.
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
  storage:
    size: {{ $.Values.postgres.persistence.size }}
    {{- with $.Values.postgres.persistence.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml $.Values.postgres.resources | nindent 4 }}
{{- end }}
