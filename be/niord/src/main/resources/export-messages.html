<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: lightgray;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.42857143;
            color: #333;
        }

        a {
            color: #337ab7;
            text-decoration: none;
        }

        a:hover,
        a:focus {
            color: #23527c;
            text-decoration: underline;
        }

        p {
            margin: 0 0 10px;
        }

        ul,
        ol {
            margin-top: 0;
            margin-bottom: 10px;
        }

        img {
            vertical-align: middle;
        }

        .container {
            margin: 0 auto;
            padding: 0 15px;
            background-color: white;
        }

        @media (min-width: 768px) {
            .container {
                width: 750px;
            }
        }

        @media (min-width: 992px) {
            .container {
                width: 970px;
            }
        }

        @media (min-width: 1200px) {
            .container {
                width: 1170px;
            }
        }

        .map-box {
            display: flow-root;
            margin: 0 -15px;
            padding: 0 15px;
            border-bottom: 1px solid lightgray;
        }

        .map {
            width: 95%;
            height: 400px;
            margin: 20px;
            border: 1px solid gray;
        }

        .message {
            padding: 20px;
            border-bottom: 1px solid lightgray;
        }

        .label-message-id {
            display: inline-block;
            margin-bottom: 4px;
            padding: .2em .6em .3em;
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
            color: #fff;
            white-space: nowrap;
            border-radius: .25em;
            background-color: #999;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* A details row: a label column and a value column */
        .row {
            display: flex;
            margin: 0 -15px;
        }

        .row > div {
            min-height: 1px;
            padding: 5px 15px 0;
        }

        .message-details-item-field {
            flex: 0 0 16.66666667%;
            max-width: 16.66666667%;
            font-weight: bold;
            color: gray;
        }

        .message-details-item-value {
            flex: 0 0 83.33333333%;
            max-width: 83.33333333%;
        }

        @media (min-width: 768px) {
            .message-details-item-field {
                flex-basis: 8.33333333%;
                max-width: 8.33333333%;
            }

            .message-details-item-value {
                flex-basis: 91.66666667%;
                max-width: 91.66666667%;
            }
        }

        .message-details-item-value ol {
            padding-left: 0;
        }

        .row > .message-source {
            flex: 0 0 100%;
            max-width: 100%;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="map-box">
        <div id="map" class="map"></div>
    </div>

    <div id="messages"></div>
</div>

<script>
    (function () {
        'use strict';

        // MessageExportService injects the exported search result here, escaped as a JavaScript string
        const messages = JSON.parse('<<MESSAGES-JSON>>').data || [];

        const REFERENCE_TYPE_TEXTS = {
            REPETITION: '(repetition)',
            REPETITION_NEW_TIME: '(repetition with new time)',
            CANCELLATION: '(cancelled)',
            UPDATE: '(updated)'
        };

        // The label of a message part by its type, in the words of the message dictionary's English texts
        // (msg.field.details and the rest); a type this page does not know is shown as it is stored
        const PART_TYPE_TEXTS = {
            DETAILS: 'Details',
            TIME: 'Time',
            POSITIONS: 'Positions',
            NOTE: 'Note',
            PROHIBITION: 'Prohibition',
            SIGNALS: 'Signals'
        };

        // Elements and URL attributes that are dropped from the HTML fields (part details and publication).
        // SVG and MathML go whole: their animation elements can set a URL attribute after it is checked.
        const UNSAFE_ELEMENTS = 'script, style, iframe, object, embed, link, meta, base, form, svg, math';
        const URL_ATTRIBUTES = ['href', 'src', 'xlink:href', 'action', 'formaction'];
        const UNSAFE_URL = /^(javascript|vbscript|data):/;

        /** Creates an element with an optional class name and text content */
        function element(tagName, className, text) {
            const el = document.createElement(tagName);
            if (className) {
                el.className = className;
            }
            if (text !== undefined && text !== null) {
                el.textContent = text;
            }
            return el;
        }

        /** Returns the first description of the entity, or null if there is none */
        function firstDesc(entity) {
            return entity && entity.descs && entity.descs.length > 0 ? entity.descs[0] : null;
        }

        /** Returns whether the URL uses a script or data scheme. Data images are allowed */
        function isUnsafeUrl(url) {
            const normalized = String(url).replace(/[\u0000- ]/g, '').toLowerCase();
            return UNSAFE_URL.test(normalized) && !normalized.startsWith('data:image/');
        }

        /** Parses the HTML, removes scripts, event handlers, inline styles and unsafe URLs, and appends the result to the parent */
        function appendSanitizedHtml(parent, html) {
            const body = new DOMParser().parseFromString(html, 'text/html').body;
            body.querySelectorAll(UNSAFE_ELEMENTS).forEach(el => el.remove());
            body.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    if (name.startsWith('on') || name === 'style'
                            || (URL_ATTRIBUTES.includes(name) && isUnsafeUrl(attr.value))) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            parent.append(...body.childNodes);
        }

        /** Appends a row with a label column and a value column, and returns the value column */
        function appendRow(parent, label) {
            const row = parent.appendChild(element('div', 'row'));
            row.appendChild(element('div', 'message-details-item-field', label));
            return row.appendChild(element('div', 'message-details-item-value'));
        }

        /** Renders the message with its title line, references, parts, attachments, charts, publication and source */
        function renderMessage(msg) {
            const block = element('div', 'message');
            const desc = firstDesc(msg);

            // Title line
            if (msg.originalInformation) {
                block.appendChild(element('div', null, '★'));
            }
            if (msg.shortId) {
                block.appendChild(element('div')).appendChild(element('span', 'label-message-id', msg.shortId));
            }
            if (desc) {
                block.appendChild(element('div')).appendChild(element('strong', null, desc.title));
            }

            // Reference lines
            (msg.references || []).forEach((ref, index) => {
                const value = appendRow(block, index === 0 ? 'References' : '');
                value.appendChild(element('span', null, ref.messageId));
                if (REFERENCE_TYPE_TEXTS[ref.type]) {
                    value.append(' ', element('span', null, REFERENCE_TYPE_TEXTS[ref.type]));
                }
                const refDesc = firstDesc(ref);
                if (refDesc && refDesc.description) {
                    value.append(' ', element('span', null, '- ' + refDesc.description));
                }
            });

            // Details lines
            (msg.parts || []).forEach(part => {
                const value = appendRow(block, Object.hasOwn(PART_TYPE_TEXTS, part.type)
                    ? PART_TYPE_TEXTS[part.type] : (part.type || ''));
                const partDesc = firstDesc(part);
                if (partDesc && partDesc.subject) {
                    value.appendChild(element('div')).appendChild(element('strong', null, partDesc.subject));
                }
                if (partDesc && partDesc.details) {
                    appendSanitizedHtml(value.appendChild(element('div')), partDesc.details);
                }
            });

            // Attachments, linked relative to the unzipped export folder
            if (msg.attachments && msg.attachments.length > 0) {
                const value = appendRow(block, 'Attachments');
                msg.attachments.forEach((att, index) => {
                    if (index > 0) {
                        value.append(', ');
                    }
                    const link = value.appendChild(element('a', null, att.fileName));
                    if (att.path && !isUnsafeUrl(att.path)) {
                        link.setAttribute('href', att.path);
                    }
                    link.target = '_blank';
                });
            }

            // Charts line
            if (msg.charts && msg.charts.length > 0) {
                appendRow(block, 'Charts').textContent = msg.charts
                    .map(chart => chart.internationalNumber
                        ? chart.chartNumber + ' (INT ' + chart.internationalNumber + ')'
                        : chart.chartNumber)
                    .join(', ');
            }

            // Publication line
            if (desc && desc.publication) {
                appendSanitizedHtml(appendRow(block, 'Publication').appendChild(element('span')), desc.publication);
            }

            // Source line
            if (desc && desc.source) {
                block.appendChild(element('div', 'row'))
                    .appendChild(element('div', 'message-details-item-value message-source', '(' + desc.source + ')'));
            }

            return block;
        }

        /** Shows the geometry of all message parts on an OpenStreetMap map, zoomed to fit the features */
        function showMap() {
            const style = new ol.style.Style({
                fill: new ol.style.Fill({
                    color: 'rgba(255, 0, 255, 0.2)'
                }),
                stroke: new ol.style.Stroke({
                    color: '#8B008B',
                    width: 1
                }),
                image: new ol.style.Circle({
                    radius: 4,
                    stroke: new ol.style.Stroke({
                        color: '#8B008B',
                        width: 1
                    }),
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 0, 255, 0.6)'
                    })
                })
            });

            // Features derived from other features (e.g. buffers) have a "parentFeatureIds" property
            const bufferedStyle = new ol.style.Style({
                fill: new ol.style.Fill({
                    color: 'rgba(100, 50, 100, 0.2)'
                }),
                stroke: new ol.style.Stroke({
                    color: 'rgba(100, 50, 100, 0.8)',
                    width: 1
                })
            });

            const source = new ol.source.Vector({
                wrapX: false
            });

            const map = new ol.Map({
                target: 'map',
                layers: [
                    new ol.layer.Tile({
                        source: new ol.source.OSM()
                    }),
                    new ol.layer.Vector({
                        source: source,
                        style: feature => feature.get('parentFeatureIds') ? bufferedStyle : style
                    })
                ],
                view: new ol.View({
                    center: ol.proj.fromLonLat([11, 56]),
                    zoom: 4
                })
            });

            const geoJsonFormat = new ol.format.GeoJSON();
            messages.forEach(msg => (msg.parts || []).forEach(part => {
                if (part.geometry && part.geometry.features) {
                    part.geometry.features.forEach(feature => source.addFeature(geoJsonFormat.readFeature(feature, {
                        dataProjection: 'EPSG:4326',
                        featureProjection: 'EPSG:3857'
                    })));
                }
            }));

            const extent = source.getExtent();
            if (!ol.extent.isEmpty(extent)) {
                map.getView().fit(extent, {
                    padding: [5, 5, 5, 5],
                    maxZoom: 12
                });
            }
        }

        const list = document.getElementById('messages');
        messages.forEach(msg => list.appendChild(renderMessage(msg)));
        showMap();
    })();
</script>

</body>
</html>
