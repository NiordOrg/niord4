# Self-contained English resource bundle used by the Freemarker directive unit tests.
#
# It bundles every key the script directives look up at render time (term.*, position.*,
# navwarn.date.* and msg.time.*) into a single deterministic bundle so the directive tests
# do not depend on the application dictionaries or on the locale-specific CLDR data.
#
# The navwarn.date.* / position.* values are copied verbatim from the application's
# template_en.properties so the directive oracles line up with NavWarnDateFormatterTest /
# PositionFormatterTest. The msg.time.* values use a simple, explicit date pattern so the
# FromToDateDirective oracles are easy to reason about.

term.and = and

position.deg = degrees
position.min = min.
position.north = North
position.east = East
position.south = South
position.west = West

navwarn.date.day_suffix = th,st,nd,rd,th,th,th,th,th,th,th,th,th,th,th,th,th,th,th,th,th,st,nd,rd,th,th,th,th,th,th,th,st
navwarn.date.html_day_suffix = <sup>{{suffix}}</sup>
navwarn.date.until_further_notice = until further notice
navwarn.date.from = from
navwarn.date.to = to
navwarn.date.until = until
navwarn.date.day_prefix = the
navwarn.date.time_prefix = at
navwarn.date.time_interval_prefix =

msg.time.until_further_notice = until further notice
msg.time.date_time_format = d MMMM yyyy HH:mm
