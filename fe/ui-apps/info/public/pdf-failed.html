<!doctype html>
<!-- What a reader's tab shows when a PDF could not be made: the message is no longer published, an
     error stopped the document, or the backend did not answer. The server answers such a failure
     with this page instead of the backend's error, keeping its status
     (`ui-apps/info/nginx/default.conf.template`); a busy backend's 503 has pdf-busy.html. Its words
     are English here and in the language the PDF was asked in once its script has read that
     language's bundle (pdf-busy.js, the script of both pages); the English is the bundle's
     DOCUMENT_LOAD_FAILED, MENU_PRINT and SITE_TITLE, held to it by `scripts/info-pdf-busy.test.mjs`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title id="pdf-title">Navigational Warnings and Notices to Mariners</title>
    <style>
      body {
        margin: 2rem auto;
        padding: 0 1rem;
        max-width: 40rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #222;
        background: #fff;
      }
      a {
        color: #0f3d66;
        text-decoration: underline;
      }
    </style>
    <script type="module" src="/pdf-busy.js"></script>
  </head>
  <body>
    <main>
      <p id="pdf-failed-text">Failed to load document</p>
      <!-- The same address again: the reader's own request, asked again. -->
      <p><a id="pdf-retry" href="">Print</a></p>
    </main>
  </body>
</html>
