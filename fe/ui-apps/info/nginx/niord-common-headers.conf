# The headers every response carries, whatever its policy. Included by niord-security-headers.conf
# and by the locations that send a policy of their own instead of the site's.
# `always` puts them on error responses too.
add_header X-Content-Type-Options "nosniff" always;
# Never no-referrer: the OpenStreetMap tile usage policy requires the page's address on every
# tile request, and a request without one can be blocked.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Always https for this host, for a year, where the reader came over https behind a TLS front;
# empty, so not sent, over plain HTTP (the map in default.conf.template).
add_header Strict-Transport-Security $niord_strict_transport_security always;
