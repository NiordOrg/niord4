# Shared by every proxied Niord location. Emptying the credential headers is what makes a token
# or session that reaches the public host unusable beyond it.
#
# proxy_read_timeout is deliberately NOT here: a JSON read and a rendered PDF want very different
# ones, and nginx refuses a directive that appears twice in the same block, so a location that
# included this file could not raise it. Each location sets its own, right after the include.

# An https backend is verified like any other server: its certificate against the image's CA
# bundle, for the name in NIORD_SERVER_URL, which is also sent as SNI. A backend reached over the
# cluster's own network is named by its http Service address instead.
proxy_ssl_server_name on;
proxy_ssl_name $proxy_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

proxy_set_header Host $proxy_host;

# What the backend learns about the reader's request is set here and not copied from the client:
# the host the reader asked for, the scheme a TLS front reports (see the map in the server
# template), and the address chain with this hop's own peer appended — the right-hand end, which
# is the part a reader of the chain trusts and the part a client cannot write. Every other
# forwarding header a framework might read is emptied, which removes it.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $niord_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";

# Credentials, and the header that picks the domain a signed-in editor works in.
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header Cookie "";
proxy_set_header NiordDomain "";

proxy_connect_timeout 5s;
