# The security headers of the public site. Included by the server block and again by every
# location that sets a header of its own: nginx gives a location its server's add_header
# directives only when the location sets none itself, so a location that sets Cache-Control and
# does not include this file serves its responses without any of them.
#
# The policy is what the built site needs and nothing more:
#   script-src 'self'        the bundles; the site has no inline script and no eval.
#   style-src 'unsafe-inline' Angular writes each component's styles into a <style> element, and
#                            OpenLayers and the message HTML's two kept declarations are style
#                            attributes.
#   img-src https:           the base-map tiles, whose host a deployment may change, and the
#                            images a message links from another site. An image runs no script.
#                            Never http: — this container serves plain HTTP behind a TLS front, so
#                            a tile address without a scheme of its own would ask for http images
#                            wherever the site is opened over http. Every tile address names
#                            https: itself; npm run layout:info fails a map page that breaks this.
#   img-src data:            an image embedded in message HTML, which the sanitiser lets through
#                            as a base64 data: URL.
#   img-src blob:            the chart overlay's tiles, fetched and handed to the map as blobs.
#   frame-ancestors          only the teaser may be embedded elsewhere; see the frame policy maps
#                            in the server template.
# `always` puts them on error responses too — a 404 page is a page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $niord_frame_ancestors" always;
include /etc/nginx/niord-common-headers.conf;
