<app-filter-panel label="messages.filter.comments.label" (clear)="clear()">
  <div class="flex items-center gap-1.5 flex-wrap">
    @for (option of options(); track option.value) {
      <button
        type="button"
        [class]="'chip ' + (value() === option.value ? 'is-active' : '')"
        [attr.aria-pressed]="value() === option.value"
        (click)="onChange(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</app-filter-panel>
