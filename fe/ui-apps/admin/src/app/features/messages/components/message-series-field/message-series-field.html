<app-autocomplete
  [value]="valueItems()"
  [suggestions]="suggestions()"
  [itemLabel]="seriesLabel"
  [multiple]="multiple()"
  [placeholder]="placeholder() | transloco"
  [ariaLabel]="placeholder() | transloco"
  [fetchError]="fetchError()"
  [emptyMessage]="'common.emptyMessage' | transloco"
  [errorMessage]="'common.fetchError' | transloco"
  [clearLabel]="'common.clear' | transloco"
  clearIcon="lucideTrash2"
  [removeLabel]="'common.remove' | transloco"
  [disabled]="disabled()"
  (query)="onSearch($event)"
  (selectionChange)="onSelectItems($event)"
  (clear)="onClear()"
  (touched)="markTouched()"
/>
