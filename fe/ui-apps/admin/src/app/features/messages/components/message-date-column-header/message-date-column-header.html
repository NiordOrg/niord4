<div class="flex items-center gap-1 whitespace-nowrap">
  <!-- Split control: the label sorts by this column; the caret opens the
       date-column picker. -->
  <span class="inline-flex items-center">
    <button
      type="button"
      class="inline-flex items-center font-semibold text-inherit hover:underline"
      (click)="onSort()"
    >
      {{ currentLabel() }}
    </button>
    <button
      type="button"
      class="ml-0.5 inline-flex items-center rounded p-0.5 text-fg-muted hover:bg-surface-sunken hover:text-fg"
      [appMenuTriggerFor]="typeMenu"
      [attr.aria-label]="selectLabel()"
    >
      <app-icon name="lucideChevronDown" class="text-xs" />
    </button>
    <app-menu #typeMenu [model]="typeOptions()" [ariaLabel]="selectLabel()" />
  </span>
  @if (isSorted()) {
    <app-icon [name]="directionIconClass()" [attr.aria-label]="directionAriaLabel()" />
  }
</div>
