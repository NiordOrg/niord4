<app-filter-panel label="messages.filter.type.label" (clear)="clear()">
  <div class="flex items-center gap-1.5 flex-wrap">
    @if (showMainTypeRadio()) {
      @for (option of mainTypeOptions(); track option.value) {
        <button
          type="button"
          [class]="'chip ' + (mainType() === option.value ? 'is-active' : '')"
          [attr.aria-pressed]="mainType() === option.value"
          (click)="onMainTypeChange(option.value)"
        >
          {{ option.label | transloco }}
        </button>
      }
    }
    @if (showNwTypes()) {
      <div class="flex items-center gap-1.5 flex-wrap">
        @for (type of visibleNwTypes(); track type) {
          <button
            type="button"
            [class]="'chip ' + (isTypeChecked(type) ? 'is-active' : '')"
            [attr.aria-pressed]="isTypeChecked(type)"
            (click)="onTypeToggle(type, !isTypeChecked(type))"
          >
            {{ 'msg.type.' + type | transloco }}
          </button>
        }
        <span class="text-xs flex gap-2">
          <button type="button" class="link-button is-subtle" (click)="selectAll('NW')">
            {{ 'msg.filter.all' | transloco }}
          </button>
          <span class="text-surface-300">/</span>
          <button type="button" class="link-button is-subtle" (click)="reset('NW')">
            {{ 'msg.filter.reset' | transloco }}
          </button>
        </span>
      </div>
    }
    @if (showNmTypes()) {
      <div class="flex items-center gap-1.5 flex-wrap">
        @for (type of visibleNmTypes(); track type) {
          <button
            type="button"
            [class]="'chip ' + (isTypeChecked(type) ? 'is-active' : '')"
            [attr.aria-pressed]="isTypeChecked(type)"
            (click)="onTypeToggle(type, !isTypeChecked(type))"
          >
            {{ 'msg.type.' + type | transloco }}
          </button>
        }
        <span class="text-xs flex gap-2">
          <button type="button" class="link-button is-subtle" (click)="selectAll('NM')">
            {{ 'msg.filter.all' | transloco }}
          </button>
          <span class="text-surface-300">/</span>
          <button type="button" class="link-button is-subtle" (click)="reset('NM')">
            {{ 'msg.filter.reset' | transloco }}
          </button>
        </span>
      </div>
    }
  </div>
</app-filter-panel>
