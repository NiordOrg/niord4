@if (publication()) {
  <span
    class="message-details-html message-publication"
    [innerHTML]="publication() | safeMessageHtml"
  ></span>
}
@if (showInternal() && internalPublication()) {
  <span
    class="message-details-html message-publication ml-1 text-surface-500"
    [innerHTML]="internalPublication() | safeMessageHtml"
  ></span>
}
