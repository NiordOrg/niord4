@if (hasVisible()) {
  <div class="grid grid-cols-1 gap-4 @lg:grid-cols-2">
    @for (p of visible(); track p.id ?? $index) {
      @let renderer = rendererFor(p.type.serviceId);
      @if (renderer) {
        <div [class.opacity-50]="!p.promulgate">
          <div
            class="mb-1 flex items-center gap-1 rounded border border-surface-200 bg-surface-100 px-2 py-1 font-semibold text-fg dark:border-surface-700 dark:bg-surface-800"
          >
            @if (isMandatoryUnset(p)) {
              <app-icon
                name="lucideTriangleAlert"
                class="text-red-600"
                [attr.aria-label]="'editor.promulgation.mandatory' | transloco"
              />
            }
            <span>{{ p.type.name }}</span>
          </div>
          <ng-container *ngComponentOutlet="renderer; inputs: inputsFor(p)" />
        </div>
      }
    }
  </div>
}
