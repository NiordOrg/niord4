<app-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [closeOnEscape]="true"
  [style]="{ width: '28rem', maxWidth: '92vw' }"
  [header]="titleKey() | transloco"
  (closed)="onHide()"
>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1 text-sm">
      <span class="font-medium text-fg">{{ 'admin.import.fileLabel' | transloco }}</span>
      <div
        class="file-drop-zone"
        [class.is-dragover]="dragOver()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <label class="btn-primary" for="jsonImportFile">
          {{ 'admin.import.chooseFile' | transloco }}
        </label>
        <span class="text-fg-muted">{{ 'admin.import.dropHint' | transloco }}</span>
        <input
          id="jsonImportFile"
          type="file"
          class="sr-only"
          [accept]="accept()"
          (change)="onFileSelected($event)"
          [disabled]="uploading()"
        />
      </div>
    </div>

    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium text-fg">{{ 'admin.import.resultLabel' | transloco }}</span>
      <textarea
        class="min-h-24 w-full rounded-niord-md border border-surface-200 bg-surface-50 p-2 font-mono text-xs text-fg"
        readonly
        [value]="resultText() ?? ''"
      ></textarea>
    </label>

    @if (resultText() && jobLink(); as link) {
      <a [routerLink]="link" class="text-sm font-medium text-primary hover:underline">
        {{ 'admin.import.viewBatchJob' | transloco }}
      </a>
    }

    <p class="text-xs text-fg-muted">{{ 'admin.import.backgroundNote' | transloco }}</p>
  </div>

  <ng-template #footer>
    <button type="button" class="btn-tertiary text-sm" (click)="close()">
      <span>{{ 'admin.import.close' | transloco }}</span>
    </button>
  </ng-template>
</app-dialog>
