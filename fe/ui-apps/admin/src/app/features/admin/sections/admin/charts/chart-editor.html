<app-drawer
  #drawerRef
  [visible]="model() !== undefined"
  [header]="headerKey()"
  [dirty]="changed()"
  (closed)="closed.emit()"
>
  @if (model()) {
    <form (submit)="$event.preventDefault(); save()" class="flex flex-col gap-5">
      <div class="flex items-center gap-2 text-sm">
        <input type="checkbox" id="chart-active" class="checkbox" [formField]="form.active" />
        <label for="chart-active">{{ 'admin.charts.field.active' | transloco }}</label>
      </div>

      <div class="flex flex-col gap-1">
        <label for="chart-number" class="text-sm font-medium text-fg-title">
          {{ 'admin.charts.field.chartNumber' | transloco }}
        </label>
        <input
          class="text-input"
          id="chart-number"
          type="text"
          [formField]="form.chartNumber"
          aria-describedby="chart-number-counter"
        />
        <app-length-counter
          counterId="chart-number-counter"
          [text]="form.chartNumber().value()"
          [limit]="textMax"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="chart-int-number" class="text-sm font-medium text-fg-title">
          {{ 'admin.charts.field.intNumber' | transloco }}
        </label>
        <input
          class="text-input"
          id="chart-int-number"
          type="number"
          [formField]="form.internationalNumber"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="chart-name" class="text-sm font-medium text-fg-title">
          {{ 'admin.charts.field.name' | transloco }}
        </label>
        <input
          class="text-input"
          id="chart-name"
          type="text"
          [formField]="form.name"
          aria-describedby="chart-name-counter"
        />
        <app-length-counter
          counterId="chart-name-counter"
          [text]="form.name().value()"
          [limit]="textMax"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="chart-scale" class="text-sm font-medium text-fg-title">
          {{ 'admin.charts.field.scale' | transloco }}
        </label>
        <div class="flex items-center gap-2">
          <span class="text-sm text-fg-muted">1:</span>
          <input
            id="chart-scale"
            type="number"
            [formField]="form.scale"
            class="flex-1 text-input"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label for="chart-datum" class="text-sm font-medium text-fg-title">
          {{ 'admin.charts.field.horizontalDatum' | transloco }}
        </label>
        <input
          class="text-input"
          id="chart-datum"
          type="text"
          [formField]="form.horizontalDatum"
          aria-describedby="chart-datum-counter"
        />
        <app-length-counter
          counterId="chart-datum-counter"
          [text]="form.horizontalDatum().value()"
          [limit]="textMax"
        />
      </div>

      <!-- Read-only extent preview with the Edit / Edit-as-text buttons overlaid
           INSIDE the map. No layer switcher here. -->
      <div class="flex flex-col gap-1">
        <span class="text-sm font-medium text-fg-title">
          {{ 'admin.charts.editor.extent.label' | transloco }}
        </span>
        <div
          class="relative h-64 overflow-hidden rounded border border-surface-200 dark:border-surface-700"
        >
          <app-ol-map class="block h-full w-full" [readOnly]="true" [view]="initialView()">
            <app-ol-tile-layer source="OSM" />
            <app-ol-geometry-preview-layer [featureCollection]="currentFc()" />
          </app-ol-map>
          @if (!hasExtent()) {
            <span
              class="pointer-events-none absolute inset-x-0 top-2 text-center text-xs text-fg-muted"
            >
              {{ 'admin.charts.editor.extent.none' | transloco }}
            </span>
          }
          <div class="absolute top-2 right-2 z-10 flex gap-2">
            <button type="button" class="btn-secondary shadow" (click)="openGeometryEditor()">
              <app-icon name="lucidePencil" class="mr-1 text-xs" />
              {{ 'admin.charts.editor.extent.edit' | transloco }}
            </button>
            <button type="button" class="btn-secondary shadow" (click)="openEditAsText()">
              <app-icon name="lucideAlignLeft" class="mr-1 text-xs" />
              {{ 'admin.charts.editor.extent.editAsText' | transloco }}
            </button>
          </div>
        </div>
      </div>

      <!-- Hidden submit makes Enter in any field submit the form (validity-gated in save()). -->
      <button type="submit" class="hidden" tabindex="-1" aria-hidden="true"></button>
    </form>
  }

  <!-- Top-level: nodes inside an @if project to the DEFAULT slot, never to a
       select()ed one — nested here, the buttons would render in the body. -->
  <div drawerFooter class="flex w-full justify-end gap-2">
    <button type="button" class="btn-tertiary" (click)="drawerRef.requestClose()">
      {{ 'admin.charts.editor.cancel' | transloco }}
    </button>
    <button type="button" class="btn-primary" [disabled]="saveDisabled()" (click)="save()">
      {{ 'admin.charts.editor.save' | transloco }}
    </button>
  </div>
</app-drawer>

<!-- The chart-extent geometry editor: a near-full-window modal over the whole
     viewport with a small margin. The editor owns its own Cancel/OK toolbar and
     Escape handling, so the shell's own close X (closable=false) and Escape
     (closeOnEscape=false) are suppressed. -->
<app-dialog
  [visible]="geometryEditorOpen()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  top="1rem"
  [style]="{
    width: 'calc(100vw - 2rem)',
    maxWidth: 'calc(100vw - 2rem)',
    height: 'calc(100vh - 2rem)',
    maxHeight: 'calc(100vh - 2rem)',
    overflow: 'hidden',
  }"
>
  @if (geometryEditorOpen()) {
    <app-geometry-editor
      class="block h-full"
      [geometry]="currentFc()"
      editType="features"
      [showImport]="true"
      drawControls="box,polygon,select,remove"
      (geometryChange)="onGeometryCommit($event)"
      (cancelled)="onGeometryCancelled()"
    />
  }
</app-dialog>

<!-- "Edit as text" reuses the geometry editor's own modal directly. -->
<app-edit-as-text-dialog
  [visible]="editAsTextOpen()"
  (visibleChange)="editAsTextOpen.set($event)"
  [featureCollection]="currentFc()"
  (saved)="onGeometryCommit($event)"
/>
