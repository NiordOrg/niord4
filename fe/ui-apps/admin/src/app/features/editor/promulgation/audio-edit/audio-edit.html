<textarea
  rows="5"
  class="w-full text-input"
  [attr.aria-label]="'editor.promulgation.audio.text' | transloco"
  [value]="promulgation().text ?? ''"
  [disabled]="disabled()"
  (input)="onInput($event)"
></textarea>
<div class="mt-2">
  <button type="button" class="btn-secondary text-sm" [disabled]="disabled()" (click)="generate()">
    {{ 'editor.promulgation.audio.generate' | transloco }}
  </button>
</div>
