<app-editor-field-row
  fieldId="publication"
  label="msg.field.publication"
  [edited]="fields.edited('publication')"
  [empty]="!hasPublication()"
  emptyLabel="editor.field.publication.empty"
>
  <div fieldViewer class="prose-sm max-w-none">
    @if (message(); as msg) {
      <app-message-publication [message]="msg" [showInternal]="true" />
    }
  </div>

  <div fieldEditor class="flex flex-col gap-4">
    @if (expanded()) {
      @for (lang of languages(); track lang.code) {
        <div class="flex flex-col gap-2">
          <span
            class="flex items-center gap-1.5 text-[0.625rem] font-bold tracking-wide text-fg-subtle uppercase"
          >
            <app-language-flag
              class="h-3.5 w-5 rounded-xs"
              [lang]="lang.code"
              [flagPath]="lang.flagPath"
              [codeFallback]="false"
            />
            {{ lang.badge }}
          </span>

          <div class="flex flex-col gap-1">
            <span class="text-xs text-fg-subtle">
              {{ 'editor.field.publication.external' | transloco }}
            </span>
            <app-rich-text-editor
              #externalEditor
              preset="inline"
              [value]="externalFor(lang.code)"
              [disabled]="!facade.editableNow()"
              [linkModal]="true"
              (linkEdit)="openLinkDialog($event, externalEditor)"
              [label]="
                'editor.field.publication.externalAria' | transloco: { language: lang.label }
              "
              (valueChange)="onExternalChange(lang.code, $event)"
            >
              <button
                richTextTools
                type="button"
                class="icon-button rte-btn"
                [disabled]="!facade.editableNow()"
                [attr.aria-label]="'editor.dialog.publications.insert' | transloco"
                [title]="'editor.dialog.publications.insert' | transloco"
                (click)="openPublications(externalEditor, 'EXTERNAL', lang.code)"
              >
                <app-icon name="lucideBook" />
              </button>
            </app-rich-text-editor>
          </div>

          <div class="flex flex-col gap-1">
            <span class="text-xs text-fg-subtle">
              {{ 'editor.field.publication.internal' | transloco }}
            </span>
            <app-rich-text-editor
              #internalEditor
              preset="inline"
              [value]="internalFor(lang.code)"
              [disabled]="!facade.editableNow()"
              [linkModal]="true"
              (linkEdit)="openLinkDialog($event, internalEditor)"
              [label]="
                'editor.field.publication.internalAria' | transloco: { language: lang.label }
              "
              (valueChange)="onInternalChange(lang.code, $event)"
            >
              <button
                richTextTools
                type="button"
                class="icon-button rte-btn"
                [disabled]="!facade.editableNow()"
                [attr.aria-label]="'editor.dialog.publications.insert' | transloco"
                [title]="'editor.dialog.publications.insert' | transloco"
                (click)="openPublications(internalEditor, 'INTERNAL', lang.code)"
              >
                <app-icon name="lucideBook" />
              </button>
            </app-rich-text-editor>
          </div>
        </div>
      }
    }
  </div>
</app-editor-field-row>

<app-insert-publications-dialog
  [(visible)]="dialogVisible"
  [kind]="dialogKind()"
  [lang]="dialogLang()"
  [publicationId]="dialogPublicationId()"
/>

<app-link-dialog
  [(visible)]="linkDialogVisible"
  [state]="linkState()"
  (confirmed)="onLinkConfirmed($event)"
/>
